<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Tracker App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .emoji {
      font-size: 100px;
      margin-bottom: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 15px;
      font-size: 32px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      font-size: 18px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #3B82F6;
      color: white;
      padding: 15px 40px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
    }
    .features {
      margin-top: 40px;
      text-align: left;
    }
    .feature {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      color: #555;
    }
    .feature span {
      margin-right: 10px;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">💧</div>
    <h1>Water Tracker</h1>
    <p>Track your daily water intake and stay hydrated!</p>

    <a href="watertracker://" class="btn">Open App</a>

    <div class="features">
      <div class="feature"><span>📊</span> Track daily water intake</div>
      <div class="feature"><span>🔔</span> Smart reminders</div>
      <div class="feature"><span>🎤</span> Voice commands with Google Assistant</div>
      <div class="feature"><span>📈</span> 7-day history</div>
    </div>
  </div>
</body>
</html>
